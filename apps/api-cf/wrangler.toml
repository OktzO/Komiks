name = "manga-api"
main = "./dist/worker.js"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

account_id = "4ce21aec2dd478bf380b7b59990a9165"

[[d1_databases]]
binding = "DB"
database_name = "manga-db"
database_id = "76606365-0fa5-4c1e-9b55-18a8366ef92a"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "6205fceab7b64f9d80f6f67e4189316b"
preview_id = "6205fceab7b64f9d80f6f67e4189316b"

[browser]
binding = "MY_BROWSER"
remote = true

# B2 credentials via `wrangler secret put` (production).
# For local preview, set in .dev.vars instead (see .dev.vars.example).
# B2_CONFIG / B2_ACCOUNTS: JSON array of B2Account objects.
# Example:
# [{
#   "name":"kom","bucket":"manga-images","keyId":"005336d7...","appKey":"K0058cxC...",
#   "region":"us-east-005","host":"s3.us-east-005.backblazeb2.com"
# }]
[vars]
EVICTION_OWNER = "1"
PEER_URLS = "https://manga-api.oktz.workers.dev,https://manga-api-2.tzok5555.workers.dev,https://manga-api-3.dwikaoktyffan.workers.dev"
PEER_INDEX = "0"

[triggers]
crons = ["0 * * * *"]
