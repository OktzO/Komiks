name: secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The scan is the gate; the test is what keeps the gate honest, since a
      # rule set that silently matches nothing passes CI while scanning nothing.
      - run: node --test scripts/scan-secrets.test.mjs
      - run: node scripts/scan-secrets.mjs
